services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rai-backend:v1.0
    container_name: rai-fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OTP_PROVIDER=${OTP_PROVIDER:-API_EMAIL}
      - TRANSACTIONAL_EMAIL_PROVIDER=${TRANSACTIONAL_EMAIL_PROVIDER:-BREVO}
      - TRANSACTIONAL_EMAIL_API_KEY=${TRANSACTIONAL_EMAIL_API_KEY}
      - TRANSACTIONAL_EMAIL_FROM=${TRANSACTIONAL_EMAIL_FROM}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      - ENABLE_DEBUG_LOGS=${ENABLE_DEBUG_LOGS:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/model/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
